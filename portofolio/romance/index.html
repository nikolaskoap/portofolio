<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f2">
  <title>Our Momen</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Ambient Hearts Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <main class="gallery-page">
    <header class="gallery-header">
      <!-- Live Counter Pill -->
      <div class="header-badge-row">
        <p class="gallery-date">11 November 2024</p>
        <button id="counter-pill" class="counter-pill" type="button" title="Klik untuk selebrasi cinta kita!">
          <span class="heart-pulse">♥</span>
          <span id="live-time-ticker">Menghitung waktu...</span>
        </button>
      </div>

      <h1 class="gallery-title">Our Momen</h1>

      <!-- Interactive Toolbar -->
      <div class="gallery-toolbar" role="toolbar" aria-label="Menu interaktif galeri">
        <button id="toolbar-slideshow-btn" class="tool-btn" type="button" title="Mulai Slideshow Otomatis">
          <span class="tool-icon">▶</span>
          <span>Slideshow</span>
        </button>
        <button id="toolbar-shuffle-btn" class="tool-btn" type="button" title="Acak Urutan Foto">
          <span class="tool-icon">⟳</span>
          <span>Acak Foto</span>
        </button>
        <button id="toolbar-music-btn" class="tool-btn" type="button" title="Buka / Tutup Playlist Spotify">
          <svg class="spotify-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="#1DB954" style="vertical-align: middle;">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          <span id="music-label">Spotify</span>
        </button>
      </div>

      <span class="header-rule" aria-hidden="true"></span>
    </header>

    <section class="gallery-section" aria-label="Galeri foto">
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="gallery-footer">
      <p class="footer-signature">11.11.2024 — Our Momen ♥</p>
    </footer>
  </main>

  <!-- Floating Spotify Player Widget -->
  <aside class="spotify-widget" id="spotify-widget" aria-label="Spotify Player">
    <div class="spotify-widget-bar">
      <button class="spotify-widget-toggle" id="spotify-toggle-btn" type="button" aria-expanded="false" title="Buka Playlist Spotify">
        <svg class="spotify-logo-svg" viewBox="0 0 24 24" width="18" height="18" fill="#1DB954">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        <span>Spotify</span>
        <span class="spotify-toggle-arrow" id="spotify-toggle-arrow">▲</span>
      </button>
      <button class="spotify-widget-dismiss" id="spotify-dismiss-btn" type="button" title="Sembunyikan tombol agar tidak menghalangi">✕</button>
    </div>

    <div class="spotify-card" id="spotify-card">
      <div class="spotify-card-top">
        <div class="spotify-title-group">
          <span class="spotify-pulse-dot"></span>
          <strong>Our Playlist</strong>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <a href="https://open.spotify.com/playlist/7eMzks9Gv2x2F3uk5p7e3s?si=agLDf80mSLWdu4_H5RdVsQ" target="_blank" rel="noopener noreferrer" class="spotify-external-link" title="Buka langsung di aplikasi Spotify">
            Buka App ↗
          </a>
          <button class="spotify-card-close" id="spotify-card-close" type="button" title="Tutup pemutar">✕</button>
        </div>
      </div>
      <div class="spotify-iframe-wrap">
        <iframe style="border-radius:12px;" src="https://open.spotify.com/embed/playlist/7eMzks9Gv2x2F3uk5p7e3s?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
    </div>
  </aside>

  <!-- Interactive Lightbox (Clean View: Only Photo + Comments + Likes) -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-top-bar">
      <span class="lightbox-counter" id="lightbox-counter">01 / 11</span>
      
      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightbox-like-btn" type="button" title="Sukai foto ini">
          <span class="like-heart" id="lightbox-like-heart">♥</span>
          <span id="lightbox-like-count">0</span>
        </button>
        <button class="lightbox-btn" id="lightbox-comment-btn" type="button" title="Buka / Tutup Komentar">
          <span class="comment-icon">💬</span>
          <span id="lightbox-comment-count">0</span>
        </button>
        <button class="lightbox-btn" id="lightbox-slideshow-toggle" type="button" title="Mulai / Jeda Slideshow">
          <span id="lightbox-play-icon">▶</span>
        </button>
        <button class="lightbox-btn" id="lightbox-zoom-toggle" type="button" title="Perbesar / Normal">
          <span id="lightbox-zoom-icon">🔍</span>
        </button>
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Tutup foto">×</button>
      </div>
    </div>

    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Foto sebelumnya">‹</button>
    
    <div class="lightbox-body">
      <figure class="lightbox-figure" id="lightbox-figure">
        <img id="lightbox-image" src="" alt="Foto Our Momen">
      </figure>

      <!-- Interactive Comments Panel (Clean & Collapsible) -->
      <aside class="lightbox-comments-panel" id="lightbox-comments-panel">
        <div class="comments-panel-header">
          <h3>Komentar</h3>
          <button class="comments-panel-close" id="comments-panel-close" type="button" aria-label="Tutup panel komentar">✕</button>
        </div>
        
        <div class="comments-list" id="comments-list">
          <!-- Comments will be populated dynamically -->
        </div>

        <form class="comment-form" id="comment-form">
          <input type="text" id="comment-input" class="comment-input" placeholder="Tulis komentar..." autocomplete="off" required>
          <button type="submit" class="comment-submit-btn">Kirim</button>
        </form>
      </aside>
    </div>
    
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Foto berikutnya">›</button>

    <!-- Thumbnail Strip for Quick Navigation -->
    <div class="lightbox-thumbnail-bar" id="lightbox-thumbnail-bar"></div>
  </div>
</body>
</html>
