<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Flower Petals in Pop Colors -->
  <g stroke="#18181b" stroke-width="7" stroke-linejoin="round">
    <!-- Top Petal (Purple) -->
    <circle cx="200" cy="100" r="55" fill="#8b5cf6" />
    <!-- Top Right (Coral) -->
    <circle cx="270" cy="140" r="55" fill="#fb7185" />
    <!-- Bottom Right (Yellow) -->
    <circle cx="270" cy="245" r="55" fill="#facc15" />
    <!-- Bottom (Cyan/Blue) -->
    <circle cx="200" cy="290" r="55" fill="#38bdf8" />
    <!-- Bottom Left (Coral) -->
    <circle cx="130" cy="245" r="55" fill="#fb7185" />
    <!-- Top Left (Purple) -->
    <circle cx="130" cy="140" r="55" fill="#8b5cf6" />
  </g>

  <!-- Center Big Yellow Smiley -->
  <circle cx="200" cy="195" r="68" fill="#fef08a" stroke="#18181b" stroke-width="8"/>
  
  <!-- Smiling Eyes -->
  <ellipse cx="175" cy="180" rx="9" ry="14" fill="#18181b"/>
  <ellipse cx="225" cy="180" rx="9" ry="14" fill="#18181b"/>
  <circle cx="178" cy="175" r="3.5" fill="#ffffff"/>
  <circle cx="228" cy="175" r="3.5" fill="#ffffff"/>

  <!-- Cheeks (Coral Pink) -->
  <ellipse cx="160" cy="202" rx="12" ry="7" fill="#fb7185" opacity="0.8"/>
  <ellipse cx="240" cy="202" rx="12" ry="7" fill="#fb7185" opacity="0.8"/>

  <!-- Big Happy Smile -->
  <path d="M 172 205 Q 200 235 228 205" fill="#18181b" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 180 214 Q 200 230 220 214 Z" fill="#ef4444"/>

  <!-- Cute Sparkles Around -->
  <polygon points="90,70 95,85 110,90 95,95 90,110 85,95 70,90 85,85" fill="#facc15" stroke="#18181b" stroke-width="3"/>
  <polygon points="320,80 325,92 338,96 325,100 320,112 315,100 302,96 315,92" fill="#38bdf8" stroke="#18181b" stroke-width="3"/>
</svg>
