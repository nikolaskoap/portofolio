<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="32" height="32">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="60%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
  </defs>

  <!-- Cat Ears -->
  <polygon points="100,190 70,70 170,130" fill="url(#catGrad)" stroke="#09052b" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="300,190 330,70 230,130" fill="url(#catGrad)" stroke="#09052b" stroke-width="7" stroke-linejoin="round"/>
  <!-- Inner Ears -->
  <polygon points="105,170 85,95 155,135" fill="#ffea00"/>
  <polygon points="295,170 315,95 245,135" fill="#ffea00"/>

  <!-- Head Base -->
  <path d="M 90 200 C 80 270 140 330 200 330 C 260 330 320 270 310 200 C 300 140 250 140 200 140 C 150 140 100 140 90 200 Z" 
        fill="url(#catGrad)" stroke="#09052b" stroke-width="7" stroke-linejoin="round"/>

  <!-- Futuristic Cyber Visor / Glasses -->
  <polygon points="110,190 290,190 275,245 200,235 125,245" fill="url(#glassesGrad)" stroke="#09052b" stroke-width="6"/>
  <!-- Glasses Neon Lines -->
  <line x1="120" y1="205" x2="280" y2="205" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <line x1="125" y1="220" x2="275" y2="220" stroke="#00f0ff" stroke-width="3" opacity="0.9"/>

  <!-- Cute Cat Nose & Mouth -->
  <polygon points="193,260 207,260 200,268" fill="#ffea00"/>
  <path d="M 188 273 Q 200 282 200 268 Q 200 282 212 273" fill="none" stroke="#09052b" stroke-width="4" stroke-linecap="round"/>

  <!-- Cheeks / Whiskers -->
  <line x1="75" y1="240" x2="40" y2="230" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="255" x2="45" y2="260" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="325" y1="240" x2="360" y2="230" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="325" y1="255" x2="355" y2="260" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
</svg>
