<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="32" height="32">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ff0044"/>
    </linearGradient>
  </defs>

  <!-- Rocket Thruster Flames -->
  <path d="M 180 290 Q 200 370 200 380 Q 200 370 220 290 Z" fill="url(#fireGrad)" />
  <path d="M 188 290 Q 200 340 200 345 Q 200 340 212 290 Z" fill="#ffffff" opacity="0.9" />

  <!-- Rocket Wings / Fins -->
  <path d="M 140 230 L 105 290 Q 145 300 170 270 Z" fill="#ff0055" stroke="#1e1b4b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 260 230 L 295 290 Q 255 300 230 270 Z" fill="#ff0055" stroke="#1e1b4b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 185 240 L 200 295 L 215 240 Z" fill="#d90429" stroke="#1e1b4b" stroke-width="3"/>

  <!-- Rocket Main Body -->
  <path d="M 200 50 C 260 120 260 240 235 285 L 165 285 C 140 240 140 120 200 50 Z" 
        fill="url(#rocketGrad)" stroke="#1e1b4b" stroke-width="6" stroke-linejoin="round"/>

  <!-- Nose Cone Accent -->
  <path d="M 200 50 C 220 75 228 105 228 115 L 172 115 C 172 105 180 75 200 50 Z" fill="#ff0055" stroke="#1e1b4b" stroke-width="4"/>

  <!-- Visor Window -->
  <circle cx="200" cy="175" r="42" fill="#1e1b4b" stroke="#1e1b4b" stroke-width="5"/>
  <circle cx="200" cy="175" r="35" fill="url(#visorGrad)"/>
  <!-- Visor Reflection -->
  <ellipse cx="190" cy="165" rx="15" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 190 165)"/>

  <!-- Little Star Details -->
  <polygon points="120,110 125,122 138,123 128,131 131,143 120,136 109,143 112,131 102,123 115,122" fill="#ffea00" stroke="#1e1b4b" stroke-width="2"/>
  <polygon points="285,120 288,129 298,130 290,136 292,145 285,140 278,145 280,136 272,130 282,129" fill="#00f0ff" stroke="#1e1b4b" stroke-width="2"/>

  <!-- Shuttle Banner Text -->
  <rect x="135" y="240" width="130" height="24" rx="6" fill="#1e1b4b"/>
  <text x="200" y="257" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="2">SHUTTLE</text>
</svg>
