<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="32" height="32">
  <!-- Pop Art Bubble Tea / Iced Coffee Cup -->
  <!-- Straw (Purple) -->
  <polygon points="215,40 240,40 215,160 190,160" fill="#a855f7" stroke="#18181b" stroke-width="7" stroke-linejoin="round"/>
  
  <!-- Cup Lid (Yellow) -->
  <ellipse cx="200" cy="140" rx="95" ry="25" fill="#facc15" stroke="#18181b" stroke-width="8"/>
  <ellipse cx="200" cy="135" rx="75" ry="16" fill="#fef08a" stroke="#18181b" stroke-width="4"/>

  <!-- Cup Body (Gradient Coffee / Coral Milk) -->
  <defs>
    <linearGradient id="cupLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <path d="M 115 145 L 140 330 C 142 355 258 355 260 330 L 285 145 Z" fill="url(#cupLiquid)" stroke="#18181b" stroke-width="8" stroke-linejoin="round"/>

  <!-- Boba Pearls -->
  <circle cx="170" cy="315" r="14" fill="#18181b"/>
  <circle cx="210" cy="320" r="15" fill="#18181b"/>
  <circle cx="238" cy="305" r="14" fill="#18181b"/>
  <circle cx="185" cy="290" r="13" fill="#18181b"/>
  <circle cx="225" cy="285" r="13" fill="#18181b"/>

  <!-- Cup Sleeve / Label (Bright Sky Blue) -->
  <path d="M 125 210 L 275 210 L 268 265 L 132 265 Z" fill="#38bdf8" stroke="#18181b" stroke-width="6"/>

  <!-- Cute Wink Face on Sleeve -->
  <path d="M 175 235 Q 185 245 195 235" fill="none" stroke="#18181b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="218" cy="235" r="5" fill="#18181b"/>
  <path d="M 195 248 Q 202 256 210 248" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Sparkles -->
  <polygon points="100,160 104,170 114,174 104,178 100,188 96,178 86,174 96,170" fill="#facc15" stroke="#18181b" stroke-width="3"/>
  <polygon points="310,210 314,222 326,226 314,230 310,242 306,230 294,226 306,222" fill="#a855f7" stroke="#18181b" stroke-width="3"/>
</svg>
